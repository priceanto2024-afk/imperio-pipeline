async function abrir(pw,recordar){try{const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(D.s),iterations:D.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(D.i)},k,b(D.c)));
if(recordar){try{localStorage.setItem("imperio_cl",pw)}catch(e){}}document.open();document.write(t);document.close();
setTimeout(()=>location.replace(location.pathname+"?t="+Date.now()),300000);return true}catch(e){return false}}
